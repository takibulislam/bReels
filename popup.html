<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <h1>Personal Assistant</h1>
      </div>
      <label class="switch master">
        <input type="checkbox" id="enabled" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <div class="section">
      <h2>Facebook</h2>
      <div class="setting-row">
        <span>Block Reels</span>
        <label class="switch">
          <input type="checkbox" id="fbReels" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Feed</span>
        <label class="switch">
          <input type="checkbox" id="fbFeed">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>Instagram</h2>
      <div class="setting-row">
        <span>Block Reels</span>
        <label class="switch">
          <input type="checkbox" id="igReels" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Explore Page</span>
        <label class="switch">
          <input type="checkbox" id="igExplore">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>YouTube</h2>
      <div class="setting-row">
        <span>Block Shorts</span>
        <label class="switch">
          <input type="checkbox" id="ytShorts" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Suggested Feed</span>
        <label class="switch">
          <input type="checkbox" id="ytFeed">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
