<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Assistant Settings</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Personal Twik</h1>
      <p>Personal Assistant</p>
    </header>
    
    <div class="section">
      <h2>Facebook</h2>
      <div class="setting-row">
        <span>Block Reels</span>
        <label class="switch">
          <input type="checkbox" id="fbReels" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Feed</span>
        <label class="switch">
          <input type="checkbox" id="fbFeed">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>Instagram</h2>
      <div class="setting-row">
        <span>Block Reels</span>
        <label class="switch">
          <input type="checkbox" id="igReels" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Explore Page</span>
        <label class="switch">
          <input type="checkbox" id="igExplore">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <h2>YouTube</h2>
      <div class="setting-row">
        <span>Block Shorts</span>
        <label class="switch">
          <input type="checkbox" id="ytShorts" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Block Suggested Feed</span>
        <label class="switch">
          <input type="checkbox" id="ytFeed">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
    
    <div class="section">
      <h2>Upwork</h2>
      <div class="setting-row">
        <span>Auto-Redirect to Most Recent</span>
        <label class="switch">
          <input type="checkbox" id="upworkRedirect" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Auto Refresh (Current Page)</span>
        <label class="switch">
          <input type="checkbox" id="upworkRefreshActive">
          <span class="slider round"></span>
        </label>
      </div>
      <div class="setting-row" id="refreshSettingsRow" style="display: none; flex-direction: column; align-items: flex-start; gap: 8px;">
        <div style="display: flex; gap: 10px; width: 100%;">
          <div style="flex: 1; display: flex; flex-direction: column;">
            <label for="upworkRefreshMin" style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Min (sec)</label>
            <input type="number" id="upworkRefreshMin" class="number-input" value="30" min="5">
          </div>
          <div style="flex: 1; display: flex; flex-direction: column;">
            <label for="upworkRefreshMax" style="font-size: 11px; color: #94a3b8; margin-bottom: 4px;">Max (sec)</label>
            <input type="number" id="upworkRefreshMax" class="number-input" value="60" min="5">
          </div>
        </div>
        <div id="upworkRefreshTarget" style="font-size: 10px; color: #64748b; word-break: break-all; margin-top: 4px;">Target: None</div>
        <div id="upworkCountdown" style="font-size: 11px; color: #38bdf8; font-weight: 600; display: none; margin-top: 2px;"></div>
      </div>
    </div>
    
    <footer>
      <p>Stay focused, stay productive.</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
